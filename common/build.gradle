dependencies {
    // Same dependency versions as the Spring Boot apps (kafka-clients, Testcontainers, ...).
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.6')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.5.6')
    // Boot 3.5.6 pins Testcontainers 1.21.3, whose docker-java speaks API 1.32; Docker 29 (colima) rejects < 1.40.
    testImplementation enforcedPlatform('org.testcontainers:testcontainers-bom:1.21.4')

    api project(':proto')
    api 'org.apache.kafka:kafka-clients'
    api 'io.lettuce:lettuce-core' // Redis: membership heartbeats, ring metadata (version from the Boot BOM)
    implementation 'org.slf4j:slf4j-api'

    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testRuntimeOnly 'org.slf4j:slf4j-simple'
}

tasks.register('chunkStats', JavaExec) {
    description = 'Chunks data/msmarco/collection.2M.tsv and prints counts'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.vectorsearch.common.chunk.ChunkStats'
    workingDir = rootDir
}

tasks.register('ensureTopics', JavaExec) {
    description = 'Creates raw-chunks / raw-chunks.dlq on the local broker if missing (-Pbootstrap=host:port)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vectorsearch.common.kafka.TopicInitializer'
    args project.findProperty('bootstrap') ?: 'localhost:9092'
}

tasks.register('ringStats', JavaExec) {
    description = 'Consistent-hash ring balance vs vnode count, and key movement when a 4th node joins'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vectorsearch.common.ring.RingStats'
    if (project.hasProperty('args')) args project.property('args').split(' ')
}
