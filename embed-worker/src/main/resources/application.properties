spring.application.name=embed-worker
server.port=8075

worker.bootstrap-servers=localhost:9092
worker.group-id=embed-worker
worker.batch-size=64
worker.batch-max-wait=50ms
worker.max-poll-records=256
# must exceed the slowest batch (embed + write); retries do not count, they keep polling while paused
worker.max-poll-interval=5m
worker.embedder=onnx
worker.model-dir=data/models/all-MiniLM-L6-v2
# Phase 2: everything goes to shard-node-1 / partition node-1 (ring router comes in steps 21-23)
worker.shard-target=localhost:9101
worker.shard-partition=node-1
worker.shard-deadline=10s
# permanent failures (bad data, INVALID_ARGUMENT): tries per chunk before raw-chunks.dlq
worker.max-attempts=3

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
