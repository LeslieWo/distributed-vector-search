dependencies {
    implementation project(':embedding')
    implementation 'io.grpc:grpc-netty-shaded:1.76.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'io.grpc:grpc-inprocess:1.76.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation testFixtures(project(':shard-node')) // real shard nodes in scatter-gather tests
}

tasks.register('clusterAdmin', JavaExec) {
    description = 'Cluster metadata ops: -Pargs="show" | "init node-1,node-2,node-3" (see ClusterAdmin)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.vectorsearch.coordinator.admin.ClusterAdmin'
    workingDir = rootDir
    if (project.hasProperty('args')) args project.property('args').split(' ')
}

tasks.register('cacheBench', JavaExec) {
    description = 'Query cache hit latency vs query embedding latency (needs local Redis + model)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vectorsearch.coordinator.cache.CacheBench'
    workingDir = rootDir
}

tasks.register('queryBench', JavaExec) {
    description = 'MS MARCO dev queries through a running coordinator: -Pargs="localhost:9100 200 10 2" or "localhost:9100 show <query>"'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vectorsearch.coordinator.tools.QueryBench'
    workingDir = rootDir
    if (project.hasProperty('args')) args project.property('args').split(' ')
}

tasks.register('recallCheck', JavaExec) {
    description = 'recall@k of the coordinator vs brute force over everything stored in the cluster: -Pargs="localhost:9100 500 10"'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vectorsearch.coordinator.tools.RecallCheck'
    workingDir = rootDir
    jvmArgs '-Xmx2g'
    if (project.hasProperty('args')) args project.property('args').split(' ')
}

tasks.register('loadLoop', JavaExec) {
    description = 'Closed-loop concurrent query load with per-second stats: -Pargs="localhost:9100 4 40"'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vectorsearch.coordinator.tools.LoadLoop'
    workingDir = rootDir
    if (project.hasProperty('args')) args project.property('args').split(' ')
}
