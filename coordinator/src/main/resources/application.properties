spring.application.name=coordinator

# Public SearchService (DESIGN.md ports); HTTP only for actuator
coordinator.grpc-port=9100
server.port=8090
coordinator.grpc-threads=64

# cluster membership + ring from Redis (vs:nodes:*, vs:ring), polled every 500 ms
coordinator.redis-uri=redis://localhost:6379
coordinator.cluster-poll=500ms

# query embedding: same model as embed-worker (onnx) or the deterministic fake (hashing)
coordinator.embedder=onnx
coordinator.model-dir=data/models/all-MiniLM-L6-v2

coordinator.default-k=10
coordinator.max-k=100
# efSearch sent to shards; 0 = shard default (80)
coordinator.ef-search=0
# used when the client sends no gRPC deadline
coordinator.default-deadline=1s
# partition requests get min(query deadline - response-reserve, now + shard-timeout)
coordinator.response-reserve=5ms
coordinator.shard-timeout=500ms

# Redis query cache (step 25)
coordinator.cache-enabled=true
coordinator.cache-ttl=60s
coordinator.cache-timeout=50ms

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
