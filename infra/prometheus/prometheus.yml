global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # App services expose /actuator/prometheus from step 11 on.
  - job_name: vector-search
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081   # shard-node-1
          - host.docker.internal:8082   # shard-node-2
          - host.docker.internal:8083   # shard-node-3
          - host.docker.internal:8090   # coordinator
          - host.docker.internal:8070   # ingest
          # embed-worker-n: 8075 + 100*(n-1) (scripts/cluster.sh worker n)
          - host.docker.internal:8075
          - host.docker.internal:8175
          - host.docker.internal:8275
          - host.docker.internal:8375
          - host.docker.internal:8475
          - host.docker.internal:8575
          - host.docker.internal:8675
          - host.docker.internal:8775
