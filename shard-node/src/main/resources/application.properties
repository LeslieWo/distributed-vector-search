spring.application.name=shard-node

# Defaults = shard-node-1 (DESIGN.md ports). Override per node, e.g. --shard.node-id=node-2 --shard.grpc-port=9102
shard.node-id=node-1
shard.grpc-port=9101
shard.dimension=384
shard.hnsw-m=16
shard.hnsw-ef-construction=200
shard.hnsw-ef-search=80
shard.initial-capacity=100000
# Snapshots + write-ahead log. Relative to the working directory (repo root with bootRun).
shard.data-dir=data/snapshots/${shard.node-id}
shard.snapshot-interval=5m
# ...or earlier once the WAL passes this size. Re-measured at 1M chunks (BUILDLOG step 37): WAL replay ~6.7 MB/s
# (255 MB in ~38 s), snapshot write ~1.9 s and load ~1.1 s for 723k vectors. 256 MB bounds crash replay to ~40 s
# while a 2M-scale node (~2.7 GB of snapshots) rewrites its files 4x less often than with the old 64 MB.
shard.snapshot-wal-bytes=268435456
# Snapshot item format: java (Java-serialized records, 2,007 bytes/vector) | fp32 (compact, 2,018) | fp16 (vectors as
# half floats on disk only, memory stays fp32: 1,247 bytes/vector, recall@10 0.9670 -> 0.9669 on 100k; BUILDLOG step 37).
# Any format loads; a partition switches format the next time it is snapshotted.
shard.snapshot-format=fp16

# Membership (DESIGN.md "Redis"): vs:nodes:<node-id> = <advertise-host>:<grpc-port>, TTL 3 s, refreshed every 1 s.
# Blank redis-uri disables it.
shard.redis-uri=redis://localhost:6379
shard.advertise-host=localhost
shard.heartbeat-interval=1s
shard.heartbeat-ttl=3s
# graceful stop: delete the key, wait this long for readers to notice, then drain the gRPC server
shard.deregister-grace=1s

# HTTP is only for actuator: /actuator/health, /actuator/prometheus (scraped by Prometheus, see infra/)
server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.node=${shard.node-id}
