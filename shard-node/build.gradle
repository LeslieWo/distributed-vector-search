plugins {
    id 'java-test-fixtures' // TestShardNode for multi-node tests in embed-worker / coordinator
}

dependencies {
    implementation 'com.github.jelmerk:hnswlib-core:1.2.1'
    implementation 'io.grpc:grpc-netty-shaded:1.76.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'io.grpc:grpc-inprocess:1.76.0'
    testImplementation project(':embedding')
    testFixturesImplementation project(':common')
    testFixturesImplementation project(':proto')
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter' // GrpcServerLifecycle is a SmartLifecycle
    testImplementation 'org.testcontainers:junit-jupiter'

}

// Dev tools in src/test/java/.../bench, run with e.g. ./gradlew :shard-node:embedSubset
def benchTask = { String taskName, String mainClassName, String desc ->
    tasks.register(taskName, JavaExec) {
        description = desc
        group = 'bench'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "dev.vectorsearch.shardnode.bench.${mainClassName}"
        workingDir = rootDir
        jvmArgs '-Xmx6g'
        if (project.hasProperty('args')) args project.property('args').split(' ')
    }
}
benchTask('embedSubset', 'EmbedSubset', 'Embeds the first N chunks + Q dev queries into data/vectors')
benchTask('groundTruth', 'GroundTruth', 'Exact top-100 per query by brute force, written to data/vectors')
benchTask('shardClient', 'ShardClient', 'load|query|health against a running shard-node')
benchTask('hnswSweep', 'HnswSweep', 'recall@10 vs latency over efSearch for several M values')
benchTask('snapshotFormatCheck', 'SnapshotFormatCheck', 'bytes/vector and recall@10 before/after reload for each snapshot format')
